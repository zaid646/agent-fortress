[project]
name = "agent-fortress"
version = "0.1.0"
description = "Automated red-teaming and guardrail framework for RAG and agentic LLM systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "langgraph>=0.2.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "requests>=2.32",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
    "jinja2>=3.1",
    "numpy>=1.26",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
loadtest = ["locust>=2.30"]
gpu = ["vllm>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["attacks*", "agents*", "guardrails*", "target*", "orchestrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"